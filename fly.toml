# Fly.io config for House HQ
# NOTE: 'app' must be globally unique — change it, or let `fly launch` set it.
app = "house-hq-CHANGEME"
primary_region = "dub"   # Dublin, closest to Galway

[build]

[env]
  DB_PATH = "/data/house.db"   # database lives on the persistent volume

# Persistent volume so your SQLite data survives restarts/redeploys
[[mounts]]
  source = "house_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1     # keep one always on so data + reminders stay live

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
